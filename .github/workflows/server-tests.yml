name: Server tests

on:
  push:
    paths:
      - "SportsCalAPI/**"
      - "SportsCalModel/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "SportsCalAPI/**"
      - "SportsCalModel/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

jobs:
  unit-and-integration:
    name: Unit + integration (in-memory fakes)
    runs-on: macos-14
    defaults:
      run:
        working-directory: SportsCalAPI/SportsCalServer
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: SportsCalAPI/SportsCalServer/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('SportsCalAPI/SportsCalServer/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      # Hermetic suites only — the network-dependent ones gate themselves behind
      # RELIABILITY_SWEEP / TENNIS_FIXTURE_DIR and skip when unset, so they are safe
      # to leave out of this list but must never be *silently* dropped from it.
      #
      # This used to be a shorter allowlist that omitted ScheduleMergeTests, which is how
      # a failing merge test went unnoticed from 2026-07-02 until the Aug reliability
      # sweep. Add new hermetic suites here when you write them.
      - name: Run hermetic test suites
        run: |
          swift test \
            --filter 'ContentStateDiffTests|ContentStateHashTests|TeamMatchingTests|DedupKeyTests|RegistrationCodableTests|APNSJobStateDiffTests|APNSJobErrorHandlingTests|APNSBatchingTests|ESPNFetchJobPushToStartTests|ESPNFetchJobAlreadyLiveStartTests|ScheduleMergeTests|ScheduleUpdateJobTests|ESPNRequestHeadersTests|ForwardWindowTests|ESPNSoccerJobMergeTests|LiveMergeTests|JobLockTests|RateLimitIdentityTests|ChunkedTests|ReplayDriverTests|SetIfAbsentTests|TelemetryTests|F1EnrichmentWriteGuardTests|WorldCupBoxScoreBuilderTests|WorldCupEnrichmentTests|PushToStartEnvFallbackTests'
