name: Server build (Linux)

# The prod deploy compiles the server with the Linux release toolchain inside
# deploy/Dockerfile. That compiler can reject code the macOS one accepts — on
# 2026-10-05 an expression it "couldn't type-check in reasonable time" failed two
# deploys in a row, after every Mac build and test had passed, and prod sat on an
# old build for ~30 hours. This runs the same Docker build stage on every branch
# push, so a branch shows red before it is merged rather than after it is live.

on:
  push:
    paths:
      - "SportsCalAPI/**"
      - "SportsCalModel/**"
      - "deploy/Dockerfile"
      - ".github/workflows/server-build-linux.yml"
  pull_request:
    paths:
      - "SportsCalAPI/**"
      - "SportsCalModel/**"
      - "deploy/Dockerfile"
  workflow_dispatch:

concurrency:
  group: server-build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: swift build -c release (deploy/Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the server image's build stage
        run: docker build --file deploy/Dockerfile --target build --progress plain .

      - name: Open an issue if main fails
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh "Linux server build"
